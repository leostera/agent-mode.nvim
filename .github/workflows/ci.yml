name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - name: Unit and integration tests
        run: make test

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - name: Install lua-language-server
        run: |
          version=3.19.1
          curl -sSL "https://github.com/LuaLS/lua-language-server/releases/download/${version}/lua-language-server-${version}-linux-x64.tar.gz" -o luals.tar.gz
          mkdir -p "$HOME/luals" && tar -xzf luals.tar.gz -C "$HOME/luals"
          echo "$HOME/luals/bin" >> "$GITHUB_PATH"
      - name: Type check
        run: make typecheck
